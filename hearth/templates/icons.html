{# Simple line icons, always shown next to a text label (never on their own),
   so they are hidden from screen readers. Drawn with currentColor so they
   follow every colour theme. #}
{% macro icon(name, size=28) -%}
<svg class="icon" viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  {% if name == 'home' %}
  <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5h4v5"/>
  {% elif name == 'pill' %}
  <rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="m9.5 9.5 5 5"/>
  {% elif name == 'calendar' %}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/>
  {% elif name == 'notebook' %}
  <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>
  {% elif name == 'weather' %}
  <circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M8 20h9a4 4 0 0 0 .4-8 5 5 0 0 0-9.4 1A3.5 3.5 0 0 0 8 20z"/>
  {% elif name == 'people' %}
  <circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5 5.3"/>
  {% elif name == 'more' %}
  <circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>
  {% elif name == 'morning' %}
  <path d="M3 18h18M7 18a5 5 0 0 1 10 0"/><path d="M12 6v3M4.9 10.9l1.8 1.8M19.1 10.9l-1.8 1.8M2 14.5h1.5M20.5 14.5H22"/>
  {% elif name == 'afternoon' %}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {% elif name == 'evening' %}
  <path d="M3 18h18M7 18a5 5 0 0 1 10 0"/><path d="M12 5v5m0 0-2.5-2.5M12 10l2.5-2.5"/>
  {% elif name == 'night' %}
  <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
  {% elif name == 'check' %}
  <circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 10"/>
  {% elif name == 'alert' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>
  {% elif name == 'info' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/>
  {% elif name == 'clock' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif name == 'speaker' %}
  <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
  {% elif name == 'skip' %}
  <circle cx="12" cy="12" r="9"/><path d="m8.5 8.5 7 7"/>
  {% elif name == 'bell' %}
  <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
  {% endif %}
</svg>
{%- endmacro %}
