[project]
name = "hearth"
version = "1.0.0"
description = "Hearth: an elder-led care circle for medications, appointments and daily routines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "Werkzeug>=3.0.6,<4",
    "Jinja2>=3.1.6,<4",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: correctness, I: import order, B: bugbear, UP: modern syntax,
# S: security (bandit), SIM/C4: simplifications.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and throwaway passcodes on purpose.
"tests/*" = ["S101", "S105", "S106"]
